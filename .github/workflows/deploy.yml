name: Deploy PWA & Auto Update News

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'topics.json' # Evita loop infinito caso o worker atualize o topics.json e dispare outro push imediato na main (opcional, mas recomendado)
  schedule:
    # Executa a cada hora (no minuto 0)
    - cron: '0 * * * *'
  workflow_dispatch: # Permite disparar manualmente se quiser

permissions:
  contents: write # Alterado de 'read' para 'write' para permitir commits do script
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Notícias Atualizadas
        run: node scripts/generate-news.js
        # Nota: Certifique-se de que o script 'generate-news.js' lê o 'topics.json' atualizado!

      - name: Build do Projeto (PWA)
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload do build
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
